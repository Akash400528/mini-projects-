
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
        }

        .game-container {
            width: 90%;
            max-width: 450px;

            padding: 40px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);

            animation: appear 0.8s ease;
        }

        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px 16px;

            font-size: 16px;

            border: none;
            outline: none;

            border-radius: 10px;

            margin-bottom: 20px;

            background: white;
            color: #111827;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.5);
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(90deg, #6366f1, #8b5cf6);

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: scale(0.97);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

     

        @media (max-width: 500px) {

            .game-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 23px;
            }

            input,
            button {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>Welcome to Number Game</h1>

        <input
            type="number"
            id="numberInput"
            placeholder="Enter lucky number"
        >

        <button onclick="handleClick()">Check Number</button>

    </div>


    <script>

        console.log("harish");

        const m = document.querySelector("h1");

        const a = 10;


        const handleClick = () => {

            const data = document.querySelector("#numberInput").value;

            if (a == data) {

                m.textContent = "YOU WON 🎉 ---- Congrats";

            }
            else if (a < data) {

                m.textContent = "The value is higher than lucky number";

            }
            else {

                m.textContent = "The value is lesser than lucky number";

            }

        };

    </script>

</body>

</html>
