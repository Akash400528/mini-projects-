<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .cell {
            width: 100px;
            height: 100px;
            font-size: 2em;
            cursor: pointer;
        }

        .restart {
            padding: 10px 20px;
            font-size: 1em;
        }
        </style>
</head>
<body>

    <h1>Tic Tac Toe</h1>

    <h2 id="status">Player X's Turn</h2>

    <div class="board">
        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>
    </div>

    <button class="restart" onclick="restart()">Restart Game</button>

    
</body>
<script>
    let board = ["", "", "", "", "", "", "", "", ""];

let currentPlayer = "X";
let gameOver = false;

const cells = document.querySelectorAll(".cell");
const status = document.getElementById("status");

const winningPatterns = [
    [0, 1, 2], // Row 1
    [3, 4, 5], // Row 2
    [6, 7, 8], // Row 3

    [0, 3, 6], // Column 1
    [1, 4, 7], // Column 2
    [2, 5, 8], // Column 3

    [0, 4, 8], // Diagonal
    [2, 4, 6]  // Diagonal
];

function play(index) {

    // Already filled or game finished
    if (board[index] !== "" || gameOver) {
        return;
    }

    // Store X or O
    board[index] = currentPlayer;

    // Display X or O
    cells[index].textContent = currentPlayer;

    checkWinner();

    // Change player
    if (!gameOver) {
        if (currentPlayer === "X") {
            currentPlayer = "O";
        } else {
            currentPlayer = "X";
        }

        status.textContent = "Player " + currentPlayer + "'s Turn";
    }
}

function checkWinner() {

    for (let pattern of winningPatterns) {

        let a = pattern[0];
        let b = pattern[1];
        let c = pattern[2];

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {

            status.textContent =
                "Player " + currentPlayer + " Wins!";

            gameOver = true;
            return;
        }
    }

    // Check draw
    if (!board.includes("")) {

        status.textContent = "It's a Draw!";

        gameOver = true;
    }
}

function restart() {

    board = ["", "", "", "", "", "", "", "", ""];

    currentPlayer = "X";
    gameOver = false;

    cells.forEach(function(cell) {
        cell.textContent = "";
    });

    status.textContent = "Player X's Turn";
}
</script>
</html>
